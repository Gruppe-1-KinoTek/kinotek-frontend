<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./css/stylesheet.css">
</head>
<nav>
    <span class="logo">Logo</span>
    <ul class="navigation">
        <li>NavTest</li>
    </ul>
</nav>

<body>
<h3>Create movie</h3>
<form>
    <label for="title">Movie title</label>
    <input id="title" type="text" placeholder="Title"/>
    <br>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="5" cols="50" placeholder="description"></textarea>
    <br>
    <label for="duration">Runtime</label>
    <input id="duration" type="number" placeholder="Runtime in minutes"></input>
    <br>
    <label for="genre">Genre</label>
    <select id="genre" name="genre" multiple></select>
    <br>
    <label for="ageRating">Age rating</label>
    <select id="ageRating" name="ageRating"></select>
    <br>
    <label for="imdbRef">IMDB link</label>
    <input id="imdbRef" name="imdbRef" type="url" placeholder="www.imdb.com">


</form>


</body>
</html>
